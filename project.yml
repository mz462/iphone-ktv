name: MRProbe
options: { bundleIdPrefix: com.example }
targets:
  MRProbe:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - main.m
      - Catalog.swift
      - path: party.html
        buildPhase: resources
    settings:
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic
      PRODUCT_BUNDLE_IDENTIFIER: com.example.mrprobe
      CLANG_ENABLE_OBJC_ARC: YES
      SWIFT_VERSION: "5.0"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UIFileSharingEnabled: YES
      INFOPLIST_KEY_NSAppleMusicUsageDescription: "Shows lyrics for the song playing in Music."
      INFOPLIST_KEY_NSLocalNetworkUsageDescription: "让同一 Wi-Fi 的朋友扫码点歌、发应援。"
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
